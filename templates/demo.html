<!doctype html><html><head><meta charset='utf-8'><title>Demo Terminal</title>
<link rel='stylesheet' href='/static/style.css'></head><body>
<nav><a href='/'>Home</a><a href='/demo'>Demo</a><a href='/model'>Model</a></nav>
<main class='terminal'>
<h2>Model Terminal</h2>
<div class='grid'>
<label>Capital k <input id='k' type='number' step='0.01' value='0.8'></label>
<label>α <input id='alpha' type='number' step='0.01' value='0.33'></label>
<label>δ <input id='delta' type='number' step='0.01' value='0.05'></label>
<label>ρ <input id='rho' type='number' step='0.01' value='0.04'></label>
<label>θ <input id='theta' type='number' step='0.1' value='2.0'></label>
<label>τ_k <input id='tau_k' type='number' step='0.01' value='0.1'></label>
</div>
<button class='btn primary' id='runBtn'>Run model</button>
<pre id='output'>Ready.</pre>
</main>
<script>
runBtn.onclick = async () => {
  const payload = ['k','alpha','delta','rho','theta','tau_k']
    .reduce((o,id)=> (o[id]=parseFloat(document.getElementById(id).value), o), {});
  const res = await fetch('/api/run-model',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const data = await res.json();
  output.textContent = JSON.stringify(data,null,2);
};
</script>
</body></html>
